<style>
:root {

  --muted:#526779;
  --line:#dce5eb;
  --bg:#f6f9fb;
  --amber:#80521c;
}
* {
  box-sizing:border-box;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.6 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
button,input,select,textarea {
  font:inherit;
}
button,a,input,select {
  touch-action:manipulation;
}
button {
  cursor:pointer;
}
a {
  color:var(--navy);
}
button {
  color:inherit;
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline:3px solid #1267c4;
  outline-offset:4px;
}
h1,h2,h3,p {
  margin:0;
}
h1 {
  font-size:clamp(1.65rem,2.5vw,2.1rem);
  line-height:1.4;
  letter-spacing:-.045em;
}
h2 {
  font-size:1.2rem;
  letter-spacing:-.03em;
}
h3 {
  font-size:1.05rem;
}
small,.meta {

}
button {

  border-radius:6px;
  background:white;
  padding:9px 13px;
  min-height:44px;
}
.skip {
  position:fixed;
  left:16px;
  top:-80px;
  background:white;
  padding:12px;
  z-index:10;
}
.skip:focus {
  top:12px;
}
.shell {
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  min-height:100vh;
}
.sidebar {
  background:white;
  border-right:1px solid var(--line);
  padding:32px 20px;
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  gap:36px;
}
.brand {
  font-size:1.4rem;
  font-weight:800;
  line-height:1.25;
  letter-spacing:-.06em;
  color:var(--navy);
}
.brand span {
  display:block;
  font-size:.78rem;
  letter-spacing:.04em;
  font-weight:500;
  margin-top:12px;
}
.brand-mark {
  display:flex;
  gap:4px;
  align-items:end;
  height:28px;
  margin-bottom:16px;
}
.brand-mark i {
  width:8px;
  background:var(--blue);
  height:15px;
}
.brand-mark i:nth-child(2) {
  height:23px;
  background:var(--teal);
}
.brand-mark i:nth-child(3) {
  height:28px;
  background:var(--navy);
}
nav {
  display:grid;
  gap:6px;
}
nav button {
  display:flex;
  align-items:center;
  gap:12px;
  border:0;
  text-align:left;
  background:transparent;
  color:var(--muted);
  padding:12px;
  font-size:.94rem;
}
nav button[aria-current=page] {
  background:var(--light);
  color:var(--navy);
  font-weight:750;
}
svg.icon {
  width:20px;
  height:20px;
  flex:none;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.side-note {
  margin-top:auto;
  font-size:.8rem;
  color:var(--muted);
  padding:16px 10px;
  border-top:1px solid var(--line);
}
.workspace {
  min-width:0;
}
.topbar {
  background:white;
  padding:16px 36px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
}
.topbar strong {
  font-size:.9rem;
}
.actions {
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.actions button {
  font-size:.875rem;
}
.primary {
  background:var(--navy);
  color:white;
  border-color:var(--navy);
}
main {
  max-width:1440px;
  margin:auto;
  padding:32px 36px 24px;
  min-height:72vh;
}
.eyebrow {
  color:var(--blue);
  font-size:.78rem;
  font-weight:750;
  letter-spacing:.12em;
  margin-bottom:8px;
}
.intro {
  margin-bottom:26px;
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:16px;
}
.intro p {
  color:var(--muted);
  margin-top:10px;
}
.tag {
  display:inline-block;
  border:1px solid #cbdce5;
  background:#eff6fa;
  padding:3px 9px;
  border-radius:4px;
  color:var(--navy);
  font-size:.8rem;
  white-space:nowrap;
}
.tag.warn {
  color:var(--amber);
  border-color:#ead6bb;
  background:#fff8ec;
}
.grid {
  display:grid;
  gap:20px;
  margin-bottom:20px;
}
.two {
  grid-template-columns:repeat(2,minmax(0,1fr));
}
.three {
  grid-template-columns:repeat(3,minmax(0,1fr));
}
.four {
  grid-template-columns:repeat(4,minmax(0,1fr));
}
.card {
  background:white;
  border:1px solid var(--line);
  border-radius:10px;
  padding:24px;
  min-width:0;
}
.card-head {
  display:flex;
  align-items:start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}
.kpi {
  display:block;
  text-align:left;
  width:100%;
  padding:22px;
  border-top:3px solid var(--blue);
}
.kpi .label {
  display:block;
  font-size:.9rem;
  color:var(--muted);
}
.kpi strong {
  display:block;
  font-size:clamp(1.45rem,2.1vw,1.95rem);
  line-height:1.35;
  letter-spacing:-.045em;
  margin:14px 0 10px;
  font-variant-numeric:tabular-nums;
}
.kpi .delta {
  font-size:.875rem;
  color:var(--teal);
}
.kpi small {
  display:block;
  font-size:.78rem;
  margin-top:7px;
}
.insight {
  padding:16px 20px;
  background:var(--light);
  border-left:3px solid var(--blue);
  margin-bottom:20px;
  font-size:.94rem;
}
.insight strong {
  color:var(--navy);
  margin-right:8px;
}
.note {
  font-size:.875rem;
  color:var(--muted);
  margin-top:16px;
}
.bar-row {
  width:100%;
  display:grid;
  grid-template-columns:100px minmax(30px,1fr) 100px;
  align-items:center;
  gap:12px;
  border:0;
  border-radius:0;
  padding:13px 0;
  background:transparent;
  text-align:left;
}
.bar-row:hover {
  background:#f4f8fb;
}
.bar-track {
  height:22px;
  background:repeating-linear-gradient(to right,#f0f4f7 0,#f0f4f7 calc(25% - 1px),#dce5eb calc(25% - 1px),#dce5eb 25%);
  display:block;
}
.bar-fill {
  display:block;
  height:100%;
  background:var(--blue);
  width:var(--w);
}
.bar-row:nth-child(2) .bar-fill {
  background:#6098ae;
}
.bar-row:nth-child(3) .bar-fill {
  background:#8db5bf;
}
.bar-value {
  text-align:right;
  font-size:.9rem;
  font-weight:650;
  font-variant-numeric:tabular-nums;
}
.axis {
  display:flex;
  justify-content:space-between;
  margin-left:112px;
  margin-right:112px;
  font-size:.75rem;
  color:var(--muted);
}
.chart {
  width:100%;
  height:auto;
  display:block;
  margin:8px 0;
}
.chart text {
  font:13px system-ui;
  fill:var(--muted);
}
.point-buttons {
  display:flex;
  justify-content:space-around;
  gap:8px;
}
.point-buttons button {
  border:0;
  background:#f2f7fa;
  font-size:.85rem;
  flex:1;
  padding:7px 4px;
}
.point-buttons strong {
  display:block;
  color:var(--navy);
}
.share {
  display:block;
  height:12px;
  background:#e9eff3;
  border-radius:3px;
  overflow:hidden;
  margin:20px 0 10px;
}
.share span {
  height:100%;
  display:block;
  background:var(--blue);
}
.share-label {
  display:flex;
  justify-content:space-between;
  font-size:.875rem;
  color:var(--muted);
}
.flow {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);
  margin-top:18px;
}
.flow div {
  padding:20px 16px;
  border-right:1px solid var(--line);
}
.flow div:last-child {
  border:0;
}
.flow p {
  color:var(--muted);
  font-size:.9rem;
  margin-top:6px;
}
.link-button {
  border:0;
  background:transparent;
  padding:8px 0;
  color:var(--blue);
  text-decoration:underline;
  text-underline-offset:4px;
  font-size:.9rem;
}
.model {
  border-top:3px solid var(--teal);
}
.model h3 {
  margin:10px 0;
}
.model p {
  font-size:.94rem;
}
.model dl {
  margin:20px 0 0;
}
.model dt {
  font-size:.8rem;
  color:var(--muted);
  margin-top:12px;
}
.model dd {
  margin:3px 0 0;
}
.filters {
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  align-items:end;
  margin:20px 0;
}
.filters label {
  font-size:.875rem;
  color:var(--muted);
  display:grid;
  gap:5px;
}
.filters input,.filters select {
  min-height:44px;
  max-width:100%;
  border:1px solid #aebfcb;
  border-radius:6px;
  background:white;
  color:var(--ink);
  padding:8px 12px;
}
.filters input {
  width:260px;
}
.filters select {
  padding-right:30px;
}
.table-scroll {
  overflow:auto;
  border:1px solid var(--line);
  border-radius:8px;
  background:white;
}
table {
  border-collapse:collapse;
  width:100%;
  font-size:.9rem;
  min-width:720px;
}
th {
  background:#eef3f7;
  text-align:left;
  font-size:.85rem;
  white-space:nowrap;
}
th,td {
  padding:13px 16px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}
td.num {
  text-align:right;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
td button {
  font-size:.8rem;
  padding:5px 9px;
  white-space:nowrap;
}
tbody tr:hover {
  background:#f8fbfd;
}
.empty {
  padding:32px;
  text-align:center;
  color:var(--muted);
}
.timeline {
  border-left:2px solid #8db5bf;
  margin:20px 0 0 8px;
}
.timeline div {
  position:relative;
  padding:0 0 24px 24px;
}
.timeline div:before {
  content:"";
  position:absolute;
  left:-7px;
  top:7px;
  width:12px;
  height:12px;
  background:var(--blue);
  border:2px solid white;
  border-radius:50%;
}
.timeline p {
  font-size:.9rem;
  color:var(--muted);
  margin-top:4px;
}
.checklist {
  padding-left:22px;
}
.checklist li {
  margin:12px 0;
}
.source-list {
  padding-left:20px;
  color:var(--muted);
  font-size:.9rem;
}
.source-list li {
  margin:10px 0;
}
footer {
  padding:20px 36px 30px;
  color:var(--muted);
  font-size:.8rem;
  border-top:1px solid var(--line);
}
dialog {
  border:1px solid var(--line);
  border-radius:12px;
  width:min(640px,calc(100% - 32px));
  max-height:85vh;
  overflow:auto;
  padding:28px;
  color:var(--ink);
}
dialog::backdrop {
  background:#152c4066;
}
dialog h2 {
  margin:12px 0 20px;
}
dialog dl {
  margin:0;
}
dialog dt {
  font-size:.8rem;
  color:var(--muted);
  margin-top:16px;
}
dialog dd {
  margin:4px 0;
  overflow-wrap:anywhere;
}
dialog .close {
  float:right;
}
.code-area {
  width:100%;
  height:45vh;
  font:13px/1.5 ui-monospace,monospace;
  white-space:pre;
  border:1px solid var(--line);
  padding:12px;
}
#notice {
  font-size:.85rem;
  min-height:24px;
  margin:12px 0;
  color:var(--teal);
}
@media(min-width:1600px) {
  main {
    padding-top:40px;
  }
  .grid {
    gap:24px;
  }
}
@media(max-width:1150px) {
  .shell {
    grid-template-columns:190px minmax(0,1fr);
  }
  .sidebar {
    padding:24px 12px;
  }
  main {
    padding:28px 24px;
  }
  .topbar {
    padding:14px 24px;
  }
  .four {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .three {
    grid-template-columns:1fr;
  }
  .bar-row {
    grid-template-columns:85px minmax(30px,1fr) 90px;
  }
  .axis {
    margin-left:97px;
    margin-right:102px;
  }
}
@media(max-width:760px) {
  .shell {
    display:block;
  }
  .sidebar {
    position:static;
    height:auto;
    padding:16px;
    gap:16px;
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  .brand {
    font-size:1.2rem;
  }
  .brand span,.brand-mark,.side-note {
    display:none;
  }
  nav {
    display:flex;
    overflow-x:auto;
    padding-bottom:6px;
    gap:4px;
  }
  nav button {
    white-space:nowrap;
    flex:none;
    padding:9px 12px;
  }
  nav .icon {
    width:18px;
  }
  .topbar {
    padding:12px 16px;
    align-items:start;
    flex-direction:column;
    gap:8px;
  }
  main {
    padding:24px 16px;
  }
  .intro {
    align-items:start;
    flex-direction:column;
  }
  .two {
    grid-template-columns:1fr;
  }
  .grid {
    gap:14px;
    margin-bottom:14px;
  }
  .card {
    padding:20px;
  }
  .kpi {
    padding:17px 14px;
  }
  .kpi strong {
    font-size:1.5rem;
  }
  .flow {
    grid-template-columns:1fr;
  }
  .flow div {
    border-right:0;
    border-bottom:1px solid var(--line);
    padding:16px 0;
  }
  .filters {
    align-items:stretch;
  }
  .filters label,.filters input {
    width:100%;
  }
  .filters label {
    flex:1 1 150px;
  }
  .bar-row {
    grid-template-columns:80px minmax(30px,1fr) 88px;
    gap:8px;
    font-size:.875rem;
  }
  .axis {
    margin-left:88px;
    margin-right:96px;
  }
  footer {
    padding:20px 16px;
  }
  .actions {
    gap:8px;
  }
  dialog {
    padding:20px;
  }
}
@media(max-width:480px) {
  .four {
    grid-template-columns:1fr;
  }
}
@media(prefers-reduced-motion:no-preference) {
  button {
    transition:background .15s;
  }
  button:hover {
    filter:brightness(.98);
  }
}
@media print {
  .sidebar,.topbar,.filters,footer,.link-button {
    display:none;
  }
  .shell {
    display:block;
  }
  main {
    padding:0;
  }
  .card {
    break-inside:avoid;
  }
  body {
    background:white;
  }
  button {
    color:#172b3a;
  }
  .four {
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

}
function state(row) {
 return /미기재|확인|불일치/.test(row[6]+' '+row[8]+' '+row[10])?'확인 필요':/전망|추정/.test(row[6]+' '+row[10])?'전망·추정':'자료 기재값';
}
function filtered() {
 const query = filters.query.trim().toLowerCase().replace(/\bvt\b/g,'브이티').replace(/\bapr\b/g,'에이피알');
 return DATA.filter(row=>(filters.category==='전체'||row[1]===filters.category)&&(filters.year==='전체'||row[3].includes(filters.year))&&(filters.state==='전체'||state(row)===filters.state)&&row.join(' ').toLowerCase().includes(query)).sort((a,b)=>filters.sort==='value'?(b[4]??-Infinity)-(a[4]??-Infinity):a[0]-b[0]);
}
function options(values,selected) {
 return values.map(value=>`<option ${value===selected?'selected':''}>${escapeHTML(value)}</option>`).join('');
}
function tableRows() {
 const rows=filtered();
 $('result-count').textContent=`핵심 지표 ${DATA.length}개 중 ${rows.length}개 표시`;
 $('rows').innerHTML=rows.length?rows.map(row=>`<tr><td>${row[0]}</td><td>${escapeHTML(row[2])}</td><td>${escapeHTML(row[3])}</td><td class="num">${number(row[4])}</td><td>${escapeHTML(row[5])}</td><td><span class="tag ${state(row)==='확인 필요'?'warn':''}">${state(row)}</span></td><td>${rowButton(row[0],'근거 보기')}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">조건에 해당하는 지표가 없습니다.</td></tr>';
}
function library() {
 return intro('수치에서 원문 근거까지','원천 엑셀의 화면용 핵심 지표를 선별했습니다. 단위·기간·자료 상태를 확인할 수 있습니다.')+`<section class="card"><h2>지표 탐색</h2><div class="filters"><label>검색<input id="query" type="search" placeholder="예) 생산액, VT, PDRN" value="${escapeHTML(filters.query)}"></label><label>분류<select id="category">${options(['전체',...new Set(DATA.map(row=>row[1]))],filters.category)}</select></label><label>연도<select id="year">${options(['전체','2022','2023','2024','2025','2026'],filters.year)}</select></label><label>자료 상태<select id="state">${options(['전체','자료 기재값','확인 필요','전망·추정'],filters.state)}</select></label><label>정렬<select id="sort"><option value="row" ${filters.sort==='row'?'selected':''}>엑셀 행 순서</option><option value="value" ${filters.sort==='value'?'selected':''}>수치 내림차순</option></select></label><button id="reset">초기화</button><button id="export" class="primary">선택 결과 CSV</button></div><p class="note">수치 정렬은 현재 검색 결과에 적용됩니다. 서로 다른 단위와 집계 범위는 동일 순위로 해석할 수 없습니다.</p><p id="result-count" class="meta" role="status" style="margin:16px 0"></p><div class="table-scroll" role="region" aria-label="지표 검색 결과" tabindex="0"><table><thead><tr><th scope="col">엑셀 행</th><th scope="col">지표</th><th scope="col">기준 기간</th><th scope="col">값</th><th scope="col">단위</th><th scope="col">자료 상태</th><th scope="col">출처</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="card" style="margin-top:20px"><h2>출처와 해석 기준</h2><ul class="source-list"><li>정량 원천 · 국내_기초_스킨케어_정량데이터_수정본 (1).xlsx / 정량 데이터 시트. 원본 316개 기록에서 ${DATA.length}개 핵심 지표 선별.</li><li>원문 · AI 2 _ 10 31 _ 자료조사.md. 지표별 상세 창에서 해당 줄 확인.</li><li>화면 구성·해석 · K-뷰티_밸류체인_대시보드_페이지_기획안(1).md.</li><li>생산 증감률 = (103,177 ÷ 102,961 − 1) × 100 ≈ 0.2%. 수출 증감률 = (85.3202 ÷ 76.5368 − 1) × 100 ≈ 11.5%.</li><li>제공자료를 시각화했으며 외부 원공시·통계의 별도 검증은 수행하지 않았습니다.</li></ul></section>`;
}
const renderers={overview,market,brands,odm,channels,action,data:library};
function render(page,focus=false) {
 current=renderers[page]?page:'overview';
 document.querySelectorAll('#navigation button').forEach(button=>{if(button.dataset.page===current)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
 $('main').innerHTML=renderers[current]();
 if(current==='data'){
  tableRows();
  ['query','category','year','state','sort'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',event=>{filters[id]=event.target.value;tableRows();}));
 }
 if(focus){$('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
 document.title=pages.find(item=>item[0]===current)[1]+' · K-Beauty';
}
function navigate(page) {
 if(!renderers[page])return;
 if(location.hash==='#'+page)render(page,true);else location.hash=page;
}
function openDialog(id) {
 returnFocus=document.activeElement;
 $(id).showModal();
}
function detail(id) {
 const row=data.get(Number(id));
 if(!row)return;
 const fields=[['값',number(row[4])+' '+row[5]],['기준 시점·기간',row[3]+' / '+row[9]],['분류',row[1]],['값 구분 / 집계 상태',row[6]+' / '+row[10]],['엑셀 원천','국내_기초_스킨케어_정량데이터_수정본 (1).xlsx / 정량 데이터 / '+row[0]+'행'],['자료조사 원문 위치',row[7]],['비고',row[8]||'추가 비고 없음'],['화면 해석 기준','프로젝트 제공자료 기준. 기준일 2026.10.31. 수치의 기간·회계 범위·단위를 확인해 주세요.']];
 $('detail-body').innerHTML=`<span class="tag">${state(row)}</span><h2 id="detail-title">${escapeHTML(row[2])}</h2><dl>${fields.map(([label,value])=>`<dt>${label}</dt><dd>${escapeHTML(value)}</dd>`).join('')}</dl>`;
 openDialog('detail');
}
function exportCSV() {
 const headers=['엑셀 행','분류','지표','기간','값','단위','값 구분','원문 위치','비고','기간 유형','집계 상태'];
 const cell=value=>'"'+String(value??'').replace(/"/g,'""')+'"';
 const csv=[headers,...filtered()].map(row=>row.map(cell).join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
 const anchor=document.createElement('a');anchor.href=url;anchor.download='K-뷰티_선택지표.csv';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.page)navigate(button.dataset.page);
 if(button.dataset.row)detail(button.dataset.row);
 if(button.dataset.close)$(button.dataset.close).close();
 if(button.id==='export')exportCSV();
 if(button.id==='reset'){Object.assign(filters,{query:'',category:'전체',year:'전체',state:'전체',sort:'row'});render('data');}
 if(button.id==='show-code'){$('code-text').value=sourceCode;$('notice').textContent='';openDialog('code-dialog');}
 if(button.id==='copy-code')copyCode();
});
async function copyCode() {
 try{await navigator.clipboard.writeText(sourceCode);$('notice').textContent='전체 코드를 복사했습니다.';}
 catch{const area=$('code-text');area.focus();area.select();$('notice').textContent='코드를 선택했습니다. Ctrl+C 또는 복사 메뉴를 사용해 주세요.';}
}
document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('close',()=>returnFocus?.focus()));
window.addEventListener('hashchange',()=>{
 if(location.hash==='#main')$('main').focus();
 else render(location.hash.slice(1),true);
});
render(location.hash.slice(1));

</script>
